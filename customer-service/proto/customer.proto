syntax = "proto3";

package customer;

service CustomerService {
  rpc CreateCustomer (CreateCustomerRequest) returns (CustomerResponse);
  rpc GetCustomer (GetCustomerRequest) returns (CustomerResponse);
  rpc GetCustomers (GetCustomersRequest) returns (GetCustomersResponse);
  rpc UpdateCustomer (UpdateCustomerRequest) returns (CustomerResponse);
  rpc DeleteCustomer (DeleteCustomerRequest) returns (DeleteCustomerResponse);
  rpc VerifyCustomerCredentials (VerifyCustomerCredentialsRequest) returns (VerifyCustomerCredentialsResponse);
}

message CreateCustomerRequest {
  string name = 1;
  string mobile = 2;
  string city = 3;
  string state = 4;
  string password = 5;
}

message VerifyCustomerCredentialsRequest {
  string mobile = 1;
  string password = 2;
}

message VerifyCustomerCredentialsResponse {
  int32 customerId = 1;
  string mobile = 2;
  string status = 3;
  bool authenticated = 4;
}

message GetCustomerRequest {
  int32 id = 1;
}

message GetCustomersRequest {
  int32 page = 1;
  int32 limit = 2;
  string name = 3;
  string mobile = 4;
  string city = 5;
  string state = 6;
  string status = 7;
  string fromDate = 8;
  string toDate = 9;
  string sortBy = 10;
  string sortOrder = 11;
}

message UpdateCustomerRequest {
  int32 id = 1;
  optional string name = 2;
  optional string mobile = 3;
  optional string city = 4;
  optional string state = 5;
  optional string status = 6;
}

message DeleteCustomerRequest {
  int32 id = 1;
}

message CustomerResponse {
  int32 id = 1;
  string name = 2;
  string mobile = 3;
  string city = 4;
  string state = 5;
  string status = 6;
}

message GetCustomersResponse {
  repeated CustomerResponse customers = 1;
  int32 total = 2;
  int32 page = 3;
  int32 limit = 4;
  int32 totalPages = 5;
}

message DeleteCustomerResponse {
  bool success = 1;
  string message = 2;
}
